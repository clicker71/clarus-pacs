name: Documentation Issue
description: A typo or an unclear section
title: "Docs: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: File or section
      placeholder: "e.g. README.md, section 2"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix (optional)
    validations:
      required: false
