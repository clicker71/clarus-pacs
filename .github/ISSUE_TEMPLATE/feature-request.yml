name: Feature Suggestion
description: Propose an improvement
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We follow "do one thing, do it better than anyone". If the problem is
        already solved by an external tool (nginx, DCMTK, the OS kernel), we
        delegate to it and say so.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
