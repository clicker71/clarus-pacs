# clbridge.conf — Clarus Bridge (DIMSE → DICOMweb adapter)
# nginx-style: [section], key = value, # comment
# chmod 600 — database key is in this file

[server]
# DIMSE server (PS3.7 §C.1) — listens for modalities and viewers
host = 0.0.0.0
port = 8104
ae_title = CLBRIDGE
# QA / Expose Rejected Instances AE (AIRA 57.2.1, optional).
# A DIMSE association has no per-query "show rejected" flag, so QA reviews
# rejected instances through a SECOND AE Title bound on its own port. Its
# queries go to the [dicomweb] qa_url endpoint, not to clarus_url.
# BOTH keys are required; with either one missing the bridge logs a warning
# and stays single-AE (the default).
#   expose_port = 8106
#   expose_ae_title = CLBRIDGE_QA
# Point the QA workstation at that AE and port.
# PID file: automatic (/var/run/clbridge-{port}.pid on Linux, next to the
# executable on Windows). Falls back next to the executable if /var/run is
# not writable, and the bridge runs anyway if neither is.
# Not configurable - no key, no flag, no environment variable.

[dicomweb]
# DICOMweb server to forward studies to.
# Any PS3.18-compliant server: Clarus, Orthanc, dcm4che, AWS HealthImaging.
# One knob: the full base URL, scheme http or https.
#   Local Clarus:   http://127.0.0.1:8024/dicomweb
#   Remote (TSAMI): https://tsami.example.com/dicomweb
clarus_url = http://127.0.0.1:8024/dicomweb

# QA webservice endpoint - the endpoint that provides access to hidden
# (rejected) instances, per AIRA 57.2.1. This is a SEPARATE BASE URL, not a
# query parameter, so the bridge stays usable against any server: point it at
# whatever QA endpoint that server publishes.
#   Clarus: http://127.0.0.1:8024/dicomweb_qa
# Empty (default) = no QA endpoint; the QA AE is not started.
# Used only by the QA AE (see [server] expose_port below).
# qa_url = http://127.0.0.1:8024/dicomweb_qa

# Does the ORIGIN have a Storage Commitment resource (PS3.18 13.4/13.5)?
#   true  -> commitment verdicts come from the origin's own honest check.
#   false -> today's local check against this bridge's own records.
# Unrelated to [dimse] no_storage_commit (that gates commitment-after-C-MOVE).

# Set true for a Clarus origin. Clarus exposes the commitment resource, and
# its verdict is also what advances the generated CAD workitem's Input
# Readiness to READY, so an origin-owned verdict is the only one that carries
# the readiness signal.

# Keep false for a THIRD-PARTY origin (Orthanc, dcm4che, ...). Those have no
# workitem and no readiness to advance, so there is nothing for the flag to
# buy; the local check answers the modality as before and no commit is POSTed.
storage_commitment_presence = true

# Auth is handled by the nginx reverse proxy in front.
# The bridge itself sends no auth headers — add them in nginx.

# TLS: server certificate verification is ALWAYS on (httpx/requests
# default) — there is deliberately NO knob to disable it.
# mTLS (client certificate) is optional; both keys must be set together:
#   tls_client_cert = /etc/clbridge/client.crt
#   tls_client_key  = /etc/clbridge/client.key

# Pre-flight health check before accepting C-STORE (DIMSE 0xA700 on failure).
#   always — background poller, rejects early if server is down
#   probe  — same as always, but disables on HTTP 404 (non-Clarus servers)
#   never  — no health checks, bridge learns of problems when STOW fails
health_check_mode = always

# Forward to a second (backup) DICOM archive.
# Delivery is best-effort; acquisition never waits on it. Each accepted
# C-STORE is mirrored as a C-STORE SCU to `dest` after the primary commit,
# on its own queue and metrics family (clarus_bridge_forward_*).
# enabled = false keeps behaviour identical to before (no mirror).
[forward]
enabled = false
# dest_ae / dest_host / dest_port: required only when enabled = true.
dest_ae = REGIONAL_ARCHIVE
dest_host = 192.168.1.20
dest_port = 104
# Operator cap on queued forward items while the second archive is down
# (default 20000, range 1..100000). Newest overwrite (drop-newest) at cap.
forward_max_queue = 20000

# ── DICOM Tag Coercion ───────────────────────────────────────────
# Empty PatientID/Name (allowed by PS3.5 В§10.1, Type 2 fields) leave the
# generated SOP placeholders blank, which downstream viewers render as
# unnamed studies. Bridge generates placeholders BEFORE forwarding.
# Audit trail written to Original Attributes Sequence (0400,0561)
# as required by PS3.18 §10.5.2.2.2.
[bridge]
fix_empty_patient_id = true
fix_empty_patient_name = true
id_prefix = AUTOPAT_
name_prefix = Anonymous^

[dimse]
# Max C-FIND responses per query. PS3.4 §C.4.1.1.4.
# WARNING: 0 = unlimited. On large databases (500K+ studies) an IMAGE-level
# C-FIND without filters will load MILLIONS of SOP instances into memory,
# causing OOM kill. Always keep a reasonable limit (200–1000).
# Train your radiologists to use search filters: PatientName, StudyDate,
# Modality, AccessionNumber — every DICOM viewer provides these fields.
c_find_max_responses = 200
# Person-name fuzzy matching (C-FIND). The bridge injects Levenshtein-1
# matching into every C-FIND name query:
#   bridge -> QIDO-RS -> Clarus hot path (bit-parallel Bitap on stack
#   masks, zero heap, no SQL database) -> standard C-FIND response back
#   to the scanner.
# No change is needed on the device side - it never learns DICOMweb
# exists - so typo-tolerant name search works on any viewer, however old.
# Matching is one-edit name variants, not substring search (PS3.4
# C.2.2.2.1). There is no bridge knob for this: the matching happens on
# the Clarus side, and the dials live in clarus.conf [query]
# (case_sensitive_pn, fuzzymatch_override).
# C-MOVE worker threads. Each = TCP to viewer + HTTP from Clarus. I/O-bound.
# Default: max(2, CPU cores / 2). 2→2, 4→2, 8→4, 16→8.
# More = more concurrent viewers. Too many = contention on Clarus HTTP.
c_move_workers = 2
# Disable N-ACTION Storage Commitment after C-MOVE
no_storage_commit = false

# ── DIMSE Timeouts ────────────────────────────────────────────────
# Two roles, two timeout profiles. Bridge is both SCP (receiving from
# modalities) and SCU (sending C-STORE to viewers during C-MOVE).
# Values in seconds. 0 = OS default (not recommended).

# Inbound (bridge as SCP): PS3.8 §9.1.5.
# network_timeout: idle socket timer. 0 = disabled (SCP waits for client).
# Viewers keep associations open during C-MOVE (PS3.4 §C.4.2.2) —
# can be minutes for large studies. Non-zero = kill after N seconds idle.
inbound_dimse_timeout = 60
inbound_network_timeout = 0
inbound_acse_timeout = 15

# Outbound (bridge as SCU): PS3.8 §9.1.5 — bridge sends C-STORE to
# viewer during C-MOVE. Viewer may be slow (CT study 432 slices).
# network_timeout is idle socket timeout — viewer pausing between slices.
# Too short → C-MOVE aborts mid-study. Too long → hung viewer holds worker.
outbound_dimse_timeout = 60
outbound_network_timeout = 15
outbound_acse_timeout = 10

# Total outbound A-ASSOCIATE attempts for C-MOVE (main AND single-TS
# fallback associations). Single knob, immediate retries (no sleep):
# the DICOM standard (PS3.8 9.1.5/9.1.6) is silent on retry policy, so the
# simplest deterministic policy wins. Range 1-5. Worst case per association
# = attempts x outbound_acse_timeout. NOTE: this masks only TRANSIENT misses
# - a minutes-long peer wedge defeats any count. Keep
# attempts x outbound_acse_timeout well below move_poll_timeout (the bridge
# logs a startup WARN if they collide).
outbound_assoc_attempts = 3

# C-MOVE progress poll timeout (seconds). The bridge holds the viewer's
# association and polls C-MOVE job progress in the DB (0.5 s interval).
# If a worker dies between picking and finishing a job, the unfinished
# jobs are finished as failed and 0xB000 is returned instead of hanging
# the viewer. Range: 30-3600.
move_poll_timeout = 600

# Max simultaneous inbound DIMSE associations. Default 8 = pynetdicom
# parity and the conservative choice for weak boxes: at the cap the bridge
# fails SOFT ("Local limit exceeded") instead of going deep into memory
# pressure (small hosts die of memory, not of threads). One C-MOVE holds
# its association for the whole study transfer and TS-fallback opens a
# SECOND one, so 16 caps concurrent C-MOVE viewers at ~9; a bench measured
# 6-7 viewers clean at 32 (c_move_workers=2) - raise deliberately. Each
# held association costs one mostly-idle thread.
# Admin rule: 2 x concurrent C-MOVE viewers + 4 headroom.
# Range 4..256.
max_associations = 16

# ── Peer auto-registration on C-FIND ───────────────────────────────
# nginx-way: in nginx, reading config on every request is catastrophic
# (10 000 req/s × stat() + read() = I/O avalanche). But the bridge
# handles 0.1–2 C-FIND per second — a < 1ms file read against a 1–2
# second HTTP roundtrip is invisible. Hence lazyload = true by default.

# When to switch to false:
#   — Hospital with 50+ viewers (Weasis on every workstation)
#   — C-FIND every 5–10 seconds from each → 5–10 file reads/sec
#   — peers.conf on a network drive (NAS) with high latency

# With false, admin MUST send SIGHUP or HTTP POST /reload after
# editing peers.conf. With true, the next C-FIND picks up changes
# automatically in < 1ms.
[peers]
# Path to peers.conf — one AE per line: AE_TITLE  IP:PORT or AE_TITLE  NETWORK/MASK:PORT
# DICOM requires all destinations known in advance (PS3.4 §C.4.2.2.4).
peers_file = ./peers.conf
# true  (default) — per C-FIND reload. For small clinics and solo
#                    practitioners. Zero infrastructure, self-service.
# false           — reload only at startup + SIGHUP. For large
#                    hospitals and NAS storage.
lazyload = true
# Seconds between peers.conf reloads when lazyload = true.
# 0  = every C-FIND checks file (instant pickup, more I/O)
# 30 = at most once per 30 seconds (default, good for NAS storage)
# Only effective when lazyload = true.
lazyload_interval = 30

[logging]
log_level = DEBUG
# File logging (10 MB × 3 rotation). Linux: leave EMPTY (comment out) - stdout
# goes to systemd journald, which is the standard log location. Set a path
# only on Windows or when a file audit trail is required.
log_file = ./logs/bridge.log

[metrics]
# Prometheus HTTP endpoint — /metrics, /health, /print
health_port = 8105
http_bind = 127.0.0.1

# ── Outbox — reliable DICOM persistence ───────────────────────────
# Images written to disk BEFORE C-STORE returns 0x0000. Queue survives
# bridge restart. Failed deliveries retry, then move to undelivered/.
[outbox]
# Root directory for outbox queue. Subdirectories:
#   pending/      — waiting to be sent
#   in_progress/  — currently being delivered (crashed workers recover to pending/)
#   done/         — delivered (only when cleanup=false)
#   undelivered/  — exhausted all retries, needs manual review
outbox_dir = ./clbridge/outbox

# -- Patient-id masking key (secret, created automatically) --------------
# .patient_id_mask.key (32 bytes, mode 0600) is created next to the outbox on
# first start. It is the HMAC key behind the patient-id tokens in the log:
# without it those tokens could be reversed by enumerating a few-digit MRN.
#
# BACK IT UP TOGETHER WITH THE OUTBOX. Restoring an outbox without its key
# leaves the old log lines holding tokens that no longer join to new ones.
#
# Deleting the file rotates the key: only log correlation is affected (the
# study UID logged beside the token remains the primary key), forwarding is
# untouched because the outbox carries the raw PatientID.

# -- Antivirus exclusion (real-time AV, e.g. Windows Defender) -----------
# The outbox worker writes every study batch as a blob file under this
# dir before STOW - every create is AV-scanned. Field measurement (same
# 1063-instance / 987 MB corpus, loopback): excluding the AV-sensitive
# dirs made STOW batches 4-5x faster and the run's final batch 350x
# faster. For real throughput gains exclude BOTH this outbox_dir and the
# Clarus data dir (see clarus.conf [storage]):
#   Add-MpPreference -ExclusionPath "<outbox_dir>"
#   Add-MpPreference -ExclusionPath "<clarus data dir>"
max_retries = 10
# Interval between retry attempts (seconds).
# 0 = exponential backoff: 2s, 4s, 8s, 16s, 32s, 64s, max 120s.
# N = fixed interval (e.g. 30 = retry every 30 seconds).
retry_interval = 0
# STOW batching: same-study instances are accumulated and delivered as ONE
# multipart/related POST, flushed when any trigger fires:
#   batch_max_sop     count >= N   (default 100, range 1..500)
#   batch_max_bytes   bytes >= B   (default 96 MB; on-disk blob size as proxy)
#   batch_idle_sec    idle >= S s  (study tail with non-empty buffer)
# A switch to a different study also flushes immediately (batches never mix
# studies). Fieldtest: 1063 one-POST-per-slice -> ~20 POSTs.
batch_max_sop = 100
batch_max_bytes = 100663296
batch_idle_sec = 5.0
# Delete blob files after successful STOW-RS delivery?
# true  — delete immediately (production)
# false — keep for audit trail (debugging, compliance)
cleanup = true
# Keep accepting studies when the main PACS is unreachable:
# true  - C-STORE is accepted, kept on disk, and delivered
#         automatically when the server comes back.
# false - C-STORE is rejected while the server is down;
#         the sending device must retry later.
# Disk-full protection stays active in both modes.
store_forward = false


[advanced]
# SOP classes the bridge accepts (YAML). Extends built-in list.
sop_registry = ./sop_classes.yaml
# C-PRINT printer definitions (YAML)
printers_yaml = ./printers.yaml
# Directory holding the filesystem-backed SOP index (one JSON file per
# SOP Instance UID). Used at N-ACTION time to verify Storage Commitment.
# The C-MOVE job queue lives in move_jobs.db beside this directory and is
# the only SQLite-backed store in the bridge.
sop_index_dir = ./clbridge/sop_index
# Max C-STORE dataset size in MB. 0 = unlimited. PS3.7 §C.4.1.1.4.
max_store_mb = 0
# HTTP timeout for STOW-RS / QIDO-RS / WADO-RS requests (seconds).
# Applies to bridge → Clarus Server HTTP calls. Range: 1–300.
http_timeout = 30
# Health check poll interval (seconds). Range: 1–60.
health_check_interval_sec = 5
# (Dead-threshold is a fixed constant in code - DEAD_SECONDS_FATAL = 30s - not configurable.)

# ── Backpressure ──────────────────────────────────────────────────
# Outbox queue capacity (number of images). When reached, bridge
# rejects new C-STORE with DIMSE 0xA700 — modality retries (PS3.7 §C.4).
# 20000 ≈ 10 GB RAM for CT, 400 GB for mammography on disk.
stow_queue_size = 20000
# In-memory cap for the ingest queue, in megabytes (default 500,
# range 10..2000). The companion byte-cap to stow_queue_size above:
# a modality sending a few very large instances (pathology, mammography)
# reaches this limit long before it reaches 20000 images, so this is the
# guard that actually fires for those modalities. Both are ceilings, not
# allocations - a small clinic never touches either. Raise only on a host
# with the RAM to spare; lower it on a constrained box.
# stow_queue_max_mb = 500
# Max concurrent C-STORE handlers. Default: max(4, CPU cores). Range: 1–50.
# When all slots busy → DIMSE 0xA700 (Out of Resources).
# max_concurrent_cstore = 8
