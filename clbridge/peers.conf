# peers.conf — DIMSE peers for C-MOVE
# chmod 644 — no secrets here, safe to share with colleagues
#
# ── Format (space or colon for port — whichever you prefer) ────────
#
#   Exact address (one machine):
#     AE_TITLE  IP  PORT
#     AE_TITLE  IP:PORT
#
#   CIDR subnet (all machines in the network):
#     AE_TITLE  NETWORK/MASK  PORT
#     AE_TITLE  NETWORK/MASK:PORT
#
#   Full mask subnet (if you find it clearer):
#     AE_TITLE  NETWORK  MASK  PORT
#
#   Mask can be:
#     /24               — CIDR prefix (1–32)
#     /255.255.255.0    — full mask in CIDR notation
#     255.255.255.0     — full mask as a separate token
#
# ── Examples ────────────────────────────────────────────────────────
#
# Single Weasis machine:
#   WEASIS_AE  127.0.0.1  11113
#   WEASIS_AE  127.0.0.1:11113
#
# All Weasis machines on the 192.168.1.0/24 network:
#   WEASIS_AE  192.168.1.0/24  11113
#   WEASIS_AE  192.168.1.0/24:11113
#
# Same thing with a full mask:
#   WEASIS_AE  192.168.1.0  255.255.255.0  11113
#
# ── What the PORT means (read this before adding a modality) ────────
#
# The port is ONLY the outbound C-MOVE destination: where the bridge
# CONNECTS when the modality reads images back. It is never an inbound
# listen port of the bridge.
#
# Every line below carries a port, because the parser requires one. For a
# modality that never reads back, the value is unused: state the DICOM
# default 104 so the line reads as "no read-back SCP". For a modality that
# DOES read back via C-MOVE (a viewer, a review station), state ITS SCP
# listen port - the port the bridge must call when that AE is named as the
# Move Destination.
#
# Examples:
#   CT_ROOM   10.0.0.5  104      store only: sends images in, no read-back
#   VIEWSTN   10.0.0.9  11113    reads back: C-MOVE connects to 11113
#
# ── Inbound matching uses the AE TITLE only ─────────────────────────
#
# With [server] require_known_peers = true (the default) the bridge refuses
# any association whose CALLING AE Title is not named below, with an
# A-ASSOCIATE-RJ. The match is on the title alone: the calling side's source
# port is ephemeral and is never compared. Titles are compared without
# regard to case or the 16-character padding.
#
# The list is read at START-UP. A peer added here takes effect on restart.
# Our own test AEs belong here too, or the filter blocks our own probes.
#
# ── Active peers ────────────────────────────────────────────────────

# WEASIS_AE  127.0.0.1:11113
WEASIS_AE  192.168.1.0/24:11113
DVT_MOVE  127.0.0.1:8107
DCST4  127.0.0.1:11113
DMWLT4  127.0.0.1:11114
