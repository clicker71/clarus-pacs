# peers.conf — DIMSE peers for C-MOVE
# chmod 644 — no secrets here, safe to share with colleagues
#
# ── Format (space or colon for port — whichever you prefer) ────────
#
#   Exact address (one machine):
#     AE_TITLE  IP  PORT
#     AE_TITLE  IP:PORT
#
#   CIDR subnet (all machines in the network):
#     AE_TITLE  NETWORK/MASK  PORT
#     AE_TITLE  NETWORK/MASK:PORT
#
#   Full mask subnet (if you find it clearer):
#     AE_TITLE  NETWORK  MASK  PORT
#
#   Mask can be:
#     /24               — CIDR prefix (1–32)
#     /255.255.255.0    — full mask in CIDR notation
#     255.255.255.0     — full mask as a separate token
#
# ── Examples ────────────────────────────────────────────────────────
#
# Single Weasis machine:
#   WEASIS_AE  127.0.0.1  11113
#   WEASIS_AE  127.0.0.1:11113
#
# All Weasis machines on the 192.168.1.0/24 network:
#   WEASIS_AE  192.168.1.0/24  11113
#   WEASIS_AE  192.168.1.0/24:11113
#
# Same thing with a full mask:
#   WEASIS_AE  192.168.1.0  255.255.255.0  11113
#
# ── Active peers ────────────────────────────────────────────────────

# WEASIS_AE  127.0.0.1:11113
WEASIS_AE  192.168.1.0/24:11113
