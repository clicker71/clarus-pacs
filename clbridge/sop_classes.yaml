# Clarus Bridge — SOP Class Registry (NEMA PS3.4 / PS3.6)
# CP-749 compliant: all standard Storage SOP Classes
# accept: true = Bridge will accept C-STORE for this class
# modality = NEMA PS3.3 Defined Term for Modality (0008,0060)
# non_image: true = SOP has no pixel data (SR, PR, RTSTRUCT, Encapsulated, SEG).
#   Bridge offers only uncompressed TS (EVRLE, IVRLE) for non-image SOPs
#   during A-ASSOCIATE. Omitted or false = image SOP, 5 passthrough TS offered.
#   Synced with server's crates/clarus-adapters/src/codec/non_image_sop_classes.rs
sop_classes:
  # ── Verification ──────────────────────────────────────
  "1.2.840.10008.1.1":
    name: Verification SOP Class
    modality: VER
    accept: true

