# clinfer - sidecar configuration (BASE layer).
#
# This file says how the sidecar runs: which origin it talks to, where its
# cache is, and where its MODELS are. It says nothing about a model - each
# model is one file in the directory below, so adding one is dropping a file
# and removing one is deleting it.
#
#   ./clinfer                 start with this file
#   ./clinfer -t              check this file AND the models directory
#   ./clinfer --config <path> start with another file
#
# The file must be UTF-8 WITHOUT a BOM.

server:
  # The DICOMweb origin (UPS/QIDO/WADO/STOW target) - a local Clarus by
  # default, which is what makes the shipped configuration start as is.
  base_url: "http://127.0.0.1:8024/dicomweb"

  # Actor name sent as X-Authenticated-User. Pure DICOMweb: there is no AE
  # title on this path.
  identity_user: "clinfer"

  # This sidecar's own listener: /health, /metrics, /version and the model
  # declaration at /processors/Questionnaire. Loopback only; a wildcard bind
  # is refused at startup.
  listen: "127.0.0.1:8124"

  # Peers allowed to call the listener above. Loopback is listed because it
  # is where the origin and a local supervisor are: an unlisted peer is
  # refused, and an EMPTY list refuses everyone rather than trusting all.
  trusted_proxies:
    - "127.0.0.1"

engine:
  # Work directories and the result cache.
  cache_dir: "./clinfer-cache"

# Where the model files are, relative to THIS FILE. Each `*.yaml` in it
# describes one model; see models/clahe.yaml for the smallest working one.
models_dir: ./models

# Where the extension StructureDefinitions of the FHIR capability document
# are published. Each extension URL in /processors/Questionnaire is
# <extension_base>/<file>.json. The three definition files ship beside this
# configuration under fhir/StructureDefinition/.
#
# The default base is the public GitHub copy - the stable canonical identity
# of these extensions. Note: this sidecar's own listener is loopback-only
# (a wildcard bind is refused at startup), so it CANNOT publish the
# definitions to the network itself. To make them reachable in your LOCAL
# NETWORK (and work without GitHub), copy the three files to a web server
# your sites can reach and point this at it, for example:
#
#   extension_base: "http://pacs-clinfer.lan/fhir/StructureDefinition"
#
# The base must stay an absolute, stable http(s) URL: it is the extension's
# identity in every exchanged document, not just a download hint.
fhir:
  extension_base: "https://github.com/clicker71/clarus-pacs/blob/main/clinfer/fhir/StructureDefinition"

# What happens to a workitem no model matches:
#   cancel - claim it, then cancel it, so the study is accounted for;
#   off    - never claim it, leaving it available to whoever does want it.
default_rule: cancel
