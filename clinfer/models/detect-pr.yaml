# Detection: boxes as a Grayscale Softcopy Presentation State.
#
# DISABLED by default. To enable: install OpenVINO (`pip install openvino`)
# and point runtime.interpreter at a python that has it, then export the
# detection IR to MODEL_XML and its labels beside it.

enabled: false

title: "Chest X-ray detection (OpenVINO)"
description: "Bounding boxes over a chest radiograph, stored as a presentation state."

provider:
  name: "PR-openvino-detect"
  vendor: "Clarus"
  version: "1.0"

input_requirements:
  modalities: [DX, CR]
  anatomy:
    - system: "http://snomed.info/sct"
      code: "51185008"
      meaning: "Thoracic structure"

output_capabilities:
  sop_classes: ["1.2.840.10008.5.1.4.1.1.11.1"]

parameters:
  - code: MODEL_XML
    type: string
    text: "Exported IR file"
  - code: LABELS
    type: string
    text: "Class labels file"
  - code: CONFIDENCE
    type: decimal
    text: "Confidence floor"
    default: 0.5
    min: 0.0
    max: 1.0

match:
  modality: [DX, CR]
  study_description_contains: ["*chest*"]

runtime:
  script: "../abi/PR-openvino-detect.py"
  interpreter: "python3"
  timeout_secs: 300

outputs:
  - kind: pr
    series_description: "AI Boxes"
    profile_version: 1
