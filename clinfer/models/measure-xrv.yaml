# Measurement: pathology coverage numbers as an Enhanced SR (TID 1500).
#
# DISABLED by default. To enable: install torch and torchxrayvision
# (`pip install torch torchxrayvision`) and download the model weights into
# that venv. Weights are NOT shipped.

enabled: false

title: "Chest X-ray pathology coverage (torchxrayvision)"
description: "Per-pathology coverage fraction with the traced outline of the model's own mask."

provider:
  name: "SR-DX-SCOORD-torchxrayvision"
  vendor: "Clarus"
  version: "1.0"

input_requirements:
  modalities: [DX, CR]
  anatomy:
    - system: "http://snomed.info/sct"
      code: "51185008"
      meaning: "Thoracic structure"

output_capabilities:
  sop_classes: ["1.2.840.10008.5.1.4.1.1.88.22"]

parameters:
  - code: CAM_THRESHOLD
    type: decimal
    text: "Class activation threshold"
    default: 0.5
    min: 0.0
    max: 1.0
  - code: MAX_VERTICES
    type: integer
    text: "Outline vertices"
    default: 256
    min: 8
    max: 4096

match:
  modality: [DX, CR]
  study_description_contains: ["*chest*"]

runtime:
  script: "../abi/SR-DX-SCOORD-torchxrayvision.py"
  interpreter: "python3"
  timeout_secs: 600

outputs:
  - kind: measurements
    series_description: "xrv measurements"
    profile_version: 1
