[package]
name = "cltranscode"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "cltranscode"
path = "src/main.rs"

[lib]
name = "cltranscode"
path = "src/lib.rs"

[dependencies]
clarus-adapters = { path = "../crates/clarus-adapters", default-features = false, features = ["transcode"] }
dicom-object = "0.10"
dicom-core = "0.10"
dicom-transfer-syntax-registry = "0.10"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
ctrlc = "3"
# cltranscode uses SHA-256 for its own purposes (auth token hashing,
# anonymizer UID derivation). Independent of clarus-adapters' CAS hash,
# which uses BLAKE3. Declared here directly (sha2 no
# longer re-exported by clarus-adapters in the default build).
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
default = ["transcode"]
transcode = ["clarus-adapters/transcode"]

# Profile settings are inherited from workspace root Cargo.toml
# (opt-level=z, lto=true, strip=true, panic=abort)
