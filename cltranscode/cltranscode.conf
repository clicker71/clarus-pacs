# cltranscode.conf -- DICOM pipeline (transcode + anonymize + proxy)
# nginx-style: [section], key = value, # comment
# chmod 600 if it contains anonymizer salt or cloud credentials.
#
# =======================================================================
# MODE: set [input] and [output] -> code shown at startup
# =======================================================================
#   D = DIMSE (mode = dimse)    W = Web (mode = dicomweb)
#
#   [input]     [output]    Mode    Use case
#   dimse       dimse        DD     modality -> cltranscode -> bridge
#   dimse       dicomweb     DW     modality -> cltranscode -> Clarus
#   dicomweb    dimse        WD     HTTP client -> cltranscode -> bridge
#   dicomweb    dicomweb     WW     HTTP client -> cltranscode -> Clarus
#
# =======================================================================
# AUDIT TRAIL -- (0400,0561) Original Attributes Sequence
# =======================================================================
# Every tag modification is recorded in DICOM tag (0400,0561).
# cltranscode APPENDS to the existing sequence -- never overwrites.
# ModifyingSystem is set to the instance's calling AE (dimse_calling_ae).

#
# Chain example: modality -> cltranscode -> clbridge -> Clarus:
#   Item 1: CLTRANSCODE -- changed TransferSyntaxUID (transcoding)
#   Item 2: CLBRIDGE    -- changed PatientID (COERCE)
# Both items survive -- full history is preserved.
# =======================================================================

# -- Input -- where DICOM data comes from -------------------------------
[input]
# mode: "dimse" (C-STORE SCP -- modalities send studies here)
#       "dicomweb" (STOW-RS HTTP server -- HTTP clients POST here)
mode = dimse

# AE Title that modalities MUST use as "Called AE" when connecting.
# Modalities address cltranscode by this name.
# Default: CLTRANSCODE.
dimse_ae_title = CLTRANSCODE

# DIMSE port -- modalities connect to this port to send DICOM.
# Default 8106. Does NOT conflict with clbridge (8104) or Clarus (8024).
dimse_port = 8106

# DICOMweb HTTP port -- HTTP clients POST studies to this port.
# Default 8107.
dicomweb_port = 8107

# -- Output -- where processed DICOM data goes --------------------------
[output]
# mode: "dimse" (C-STORE SCU -- forward to another DIMSE server)
#       "dicomweb" (STOW-RS HTTP client -- forward to a DICOMweb server)
mode = dimse

# AE Title used when sending DICOM via DIMSE (who we connect TO).
# Default: CLBRIDGE.
dimse_ae_title = CLBRIDGE

# AE Title we identify AS when connecting (who we ARE).
# Must be unique per instance in multi-instance deployments
# (e.g., LOSSLESS_AE, ANONYMIZE_AE, RESEARCH_AE).
# Default: CLTRANSCODE.
dimse_calling_ae = CLTRANSCODE

# DIMSE server hostname or IP to forward studies to.
# Default: 127.0.0.1 (local clbridge).
dimse_host = 127.0.0.1

# DIMSE server port. Default: 8104 (clbridge DIMSE port).
dimse_port = 8104

# DICOMweb endpoint URL for STOW-RS.
# Default: local Clarus server.
dicomweb_url = http://127.0.0.1:8024/dicomweb

# DICOMweb authentication mode:
#   none  -- no auth (default)
#   basic -- HTTP Basic Auth (add user:pass to the URL or set env vars)
#   aws   -- AWS Signature V4 (reads AWS_ACCESS_KEY_ID etc. from env)
#   gcp   -- GCP OAuth2 (reads GOOGLE_APPLICATION_CREDENTIALS from env)
dicomweb_auth = none

# -- Anonymizer -- DICOM PS3.15 de-identification -----------------------
[anonymizer]
# Anonymization profile (number or name):
#   1 = Basic              -- scrub everything except pixel data
#   2 = RetainLongitudinal -- keep PatientBirthDate for longitudinal studies
#   3 = RetainDevice       -- keep DeviceSerialNumber for equipment tracking
#   4 = RetainInstitution  -- keep InstitutionName
#   5 = Custom             -- use custom rules (see docs)
profile = 1

# Salt for pseudonymizing UIDs. Uses SHA-256(original_uid + salt).
# (!!!) CHANGE THIS to a random string before using in production.
# Keep the same salt across restarts -- otherwise longitudinal linking breaks.
salt = changeme

# -- Transcoding -- pixel compression -----------------------------------
[transcoding]
# Enable transcoding. When disabled, all DICOM passes through unchanged.
# Default: true.
enabled = true

# Target transfer syntax -- the compression format for output.
# Human-readable names (mapped to DICOM UIDs internally):
#   JPEG_LS           = 1.2.840.10008.1.2.4.80  <- best lossless, default
#   JPEG_BASELINE     = 1.2.840.10008.1.2.4.50  <- lossy, smaller files
#   JPEG2000_LOSSLESS = 1.2.840.10008.1.2.4.90  <- good ratio, slower
#   RLE               = 1.2.840.10008.1.2.5     <- fast but large
#   EXPLICIT_VR_LE    = 1.2.840.10008.1.2.1     <- no compression
#
# Non-image objects (SR, KO, PR, RAW) are never transcoded --
# they pass through unchanged.
target_ts = JPEG_LS

# JPEG-LS encode profile (strict T87 is the default).
#   t87      = ITU-T T.87 conformant stream - Weasis 4.7.x renders it
#              (CharLS decoder inside its OpenCV-dcm fork). This is the
#              production default.
#   legacygo = frozen 1.0.0/Go bytes (byte-compatible with the already
#              corpus). Weasis does NOT render these; keep only for
#              byte-parity with old stored files.
# Default: t87.
jpegls_profile = t87

# JPEG-LS NEAR parameter (0..16).
#   0  = lossless (4.80) - default.
#   >0 = near-lossless (4.81): pixels may change by up to NEAR, a
#        DELIBERATE clinic choice (diagnosis: near>0 changes pixels).
#        The target syntax is then auto-switched to 4.81.
# The legacygo profile allows ONLY near = 0 (validated at startup).
# Default: 0.
jpegls_near = 0

# -- Outbox -- retry queue for failed deliveries ------------------------
[outbox]
# Directory for the outbox spool. Contains four subdirectories:
#   raw/    -- unprocessed (just received, not yet anonymized/transcoded)
#   cooked/ -- processed, waiting to be delivered
#   done/   -- successfully delivered (cleaned after retention_hours)
#   failed/ -- gave up after max_retries attempts (NEVER auto-cleaned)
# Default: ./cltranscode/outbox
dir = ./cltranscode/outbox

# How many times to retry a failed delivery before moving to failed/.
# Retries use exponential backoff: 2s, 4s, 8s, ... up to 120s max.
# For large studies (400+ slices), more retries compensate for
# temporary Bridge congestion or outbox bursts.
# Default: 10.
max_retries = 10

# Max files in raw/ + cooked/ before rejecting new input.
# When exceeded: DIMSE -> 0xA700 (out of resources), DICOMweb -> HTTP 503 + Retry-After.
# Protects against memory exhaustion when downstream is unavailable.
# For 400+ slice studies, increase to avoid A700 during import bursts.
# Default: 2000.
max_pending = 2000

# Hours to keep successfully delivered files in done/ before cleanup.
# 24 hours = full operational cycle (day + night shift audit).
# Set to 0 to keep forever (NOT recommended -- disk will fill up).
# Default: 24.
retention_hours = 24

# -- Health + metrics endpoint -----------------------------------------
[health]
# Port for /health and /metrics HTTP server.
# Must be different per instance in multi-instance deployments.
# Default: 8108.
port = 8108

# -- Logging -----------------------------------------------------------
[logging]
# Log level: ERROR, WARN, INFO, DEBUG, TRACE.
# Use INFO for production, DEBUG for troubleshooting.
# Default: INFO.
level = INFO

# Log directory for file output with daily rotation. If empty, no file logging.
# When set, logs are written BOTH to stderr AND to file:
#   stderr -- compact, colored, human-readable (for `docker logs`, `journalctl`)
#   file   -- JSON, one object per line (for Elasticsearch, Loki, etc.)
# Rotation: daily, new file when date changes. Same behaviour as Clarus server.
# Default: empty (no file logging).
log_dir = ./cltranscode/logs
