# clarus.conf - Clarus PACS (DICOMweb server)
# chmod 600 - restrict access: paths, limits and S3 credentials live in this file

# Sections (top to bottom, grouped by concern):
#   [server]          transport, identity, timeouts
#   [query]           QIDO-RS search behaviour
#   [ups]             UPS-RS worklist + task catalog
#   [commitment]      Storage Commitment retention
#   [storage]         data home + ingest guards
#   [storage_tiers]   hot -> cold -> S3 migration
#   [btree]           study index + access/audit dirs
#   [transcode]       codec feature (bounded pool)
#   [logging]         log dir + level
#   [audit]           access journal policy (DELETE trail = audit_dir in [btree])

[server]
# Interface and port to listen on
host = 0.0.0.0
port = 8024
# PID file: automatic (/var/run on Linux, next to config on Windows).
# Not configurable - no key, no flag, no environment variable.

# Instance identity recorded in (0400,0563) Modifying System of every
# Attribute History record (0561 embeds). Default: CLARUS_SERVER:{port}
# (the bound port is substituted) - multi-instance on one host (8024,
# 8025, ...) is auto-distinct. Cluster nodes sharing a port MUST set an
# explicit per-node id. Auditors read this identity from the file
# itself, not from directory topology.
# modifying_system = clarus-node-1

# Hostname announced in the served DICOMweb capabilities document and in
# the (0008,0080) Institution Name of generated content. Default localhost.
# hostname = localhost

# -- Reverse-proxy identity (nginx in front) ----------------------
# Which client IPs may pass user-identity headers (nginx on this host is the usual trusted proxy).
# Identity headers from a NON-trusted peer are ignored (treated as
# anonymous, WARN on spoofing attempts).

trusted_proxies = 127.0.0.0/8, ::1/128
# Comma-separated CIDR list. The value above IS the default: loopback
# only - correct for nginx on the same host. Add other proxies when
# they sit on another host or a Docker bridge gateway, e.g.:
# trusted_proxies = 127.0.0.0/8, ::1/128, 172.18.0.1

require_proxy_identity = false
# Strict mode: reject protected requests from a trusted proxy that
# carry no authenticated identity. Default false (serve as anonymous
# + rate-limited WARN).

anyclass_enable = false
# Opt in to IOCM rejection notes that hide DIAGNOSTIC images (113037
# patient safety, 113038 incorrect worklist entry, 113039 retention
# expired). Quality rejections (113001) always work regardless - they
# can only hide AI results, never a CT/MR. OFF by default: while off,
# such a note is stored but hides nothing, and the counter
# clarus_iocm_anyclass_ignored_total{cause="disabled"} rises. A hidden
# diagnostic image stays hidden on every surface until an administrator
# reverses it via POST /admin/v1/instances/restore.

# -- Administrative surface (admin API + patient registry) ---------
# Which networks may reach /admin/v1/* AND /dicomweb/patients.

# DEFAULT (key absent or empty) = THE LOCAL MACHINE ONLY. Everything else
# gets 403. The admin API can delete instances and rebuild storage, so it
# must not be on the open network.

# !!! DOCKER SPECIFIC !!!
# Traffic to a PUBLISHED PORT arrives from the docker BRIDGE GATEWAY
# (typically 172.18.0.1 or 172.17.0.1), NOT from 127.0.0.1. So inside a
# container the "local machine" is the CONTAINER, and an SSH tunnel to the
# host will still get 403. Two supported ways:

#   1. Run the command in the container (no config change):
#        docker exec clarus curl -s http://127.0.0.1:8024/admin/v1/status

#   2. List the bridge network, so anything on the host can reach it:

admin_cidrs = 172.19.0.0/16

#      Use this ONLY when the host machine is the admin workstation. Find
#      the real subnet with: docker network inspect bridge

# Production-recommended: put nginx in front of the container (nginx
# sends the identity headers; add it to trusted_proxies above) and list
# the management subnet here instead of the bridge network.

# !! BEHIND NGINX: FORWARD THE CLIENT ADDRESS OR THE GATE IS BYPASSED !!
# The server can only judge a proxied request by the address nginx reports.
# Your nginx config must contain:

#     proxy_set_header X-Real-IP $remote_addr;

# WITHOUT it the server sees the socket peer (nginx on 127.0.0.1) and treats
# every request as local, leaving the admin API open to anyone who can reach
# nginx. trusted_proxies decides whether the header is believed.

# Optional second layer:

#     location /admin/v1/ {
#         allow 192.168.50.0/24;
#         deny all;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_pass http://127.0.0.1:8024;
#     }

# !! DO NOT DO THIS ON A FLAT CLINIC NETWORK !!
# admin_cidrs = 192.168.1.0/24   <-- on a flat LAN this is EVERY computer:
#                                   any of them could delete studies and
#                                   rebuild storage.

# The patient registry shares this policy because it is the embedded
# viewer's entry point. The viewer PAGE (/) stays reachable from
# everywhere - only its data requests are gated.

# admin_cidrs = 172.18.0.0/16

# -- Rejected-instance review (QA surface) --------------------------
# Which networks may use the QA endpoint /dicomweb_qa. DEFAULT (key
# absent or empty) = the local machine only (127.0.0.1, ::1). This is
# NOT admin_cidrs: admin_cidrs can change the server, this only READS
# results hidden from everyone else. The endpoint reveals instances
# hidden by a QUALITY rejection (113001) only - patient-safety and
# incorrect-worklist rejections (113037/113038) stay hidden there too.
# Read-only: STOW/update/delete answer 404 on /dicomweb_qa.

# expose_rejected_cidrs = 192.168.50.0/24

# -- HTTP endpoints (quick map) -----------------------------------
# /dicomweb          DICOMweb root URL - point PS3.18 clients here
#                    (Weasis, OHIF, Orthanc, dcm4che...: http://HOST:8024/dicomweb)
# /                  embedded viewer UI (browser)
# /health            liveness/readiness probe: 200 healthy, 503 degraded
# /metrics           Prometheus metrics endpoint
# /health/status     structured status for the embedded viewer header line.
#                    Gauge legend (same order as on screen):
#                    MNF    manifest health: OK / N CRPT (corrupt) / MISSING
#                           (CAS alive but manifests gone - server blind).
#                           MISSING -> recover, run on the server (bash/Linux;
#                           list ONLY the tiers you actually have configured):
#                             curl -X POST -H "Content-Type: application/json" -d '{"sources":["hot"]}' http://127.0.0.1:8024/admin/v1/recovery/rebuild
#                           (cold/S3 configured? add them: '{"sources":["hot","cold","s3"]}'.
#                            A tier you don't have -> 400, nothing runs.)
#                           ATTN Windows users: cmd.exe needs escaped quotes:
#                             curl -X POST -H "Content-Type: application/json" -d "{\"sources\":[\"hot\"]}" http://127.0.0.1:8024/admin/v1/recovery/rebuild
#                           PowerShell mangles inline quotes: put the JSON in a
#                           file and use --data-binary @file.json instead.
#                           progress (also viewable in any browser - just open
#                           the URL and refresh):
#                             http://127.0.0.1:8024/admin/v1/recovery/rebuild/status
#                             (or curl the same URL)
#                           While it runs the server stays UP: QIDO/WADO/STOW
#                           keep serving - the walk runs on its own thread,
#                           one rebuild at a time (second POST -> 409). Expect
#                           a disk-contention slowdown, not downtime (barely
#                           visible on SSD); memory grows with the archive
#                           (per-pass SOP/study sets). Integrity is safe: a
#                           concurrent STOW of the same study cannot race the
#                           rebuild (per-study manifest lease).
#                           Weekly integrity check (safe, writes NOTHING):
#                           the same rebuild in ?dry_run mode walks all CAS
#                           blobs and reports orphans/gaps without changing
#                           data. Schedule it via the OS at night, once a
#                           week:
#                             Linux cron:
#                               0 3 * * 0  curl -s -X POST -H "Content-Type: application/json" -d '{"sources":["hot"]}' "http://127.0.0.1:8024/admin/v1/recovery/rebuild?dry_run"
#                             Windows (Task Scheduler, run as admin):
#                               schtasks /create /tn "ClarusWeeklyScan" /tr "curl.exe -s -X POST -H \"Content-Type: application/json\" -d \"{\\\"sources\\\":[\\\"hot\\\"]}\" \"http://127.0.0.1:8024/admin/v1/recovery/rebuild?dry_run\"" /sc weekly /d SUN /st 03:00
#                           Morning check: just open the embedded viewer
#                             http://127.0.0.1:8024/
#                           - the MNF gauge in the header must show OK.
#                           Once a week, after the night scan, open
#                             http://127.0.0.1:8024/admin/v1/recovery/rebuild/status
#                           in a browser - errors must be 0.
#                           The REAL rebuild (without ?dry_run) stays MANUAL:
#                           run it only when MNF shows MISSING or N CRPT.
#                    STALE_IDX  stale/missing B-tree index rows (0 = clean).
#                               Self-heals AUTOMATICALLY - no admin action:
#                               a full reconcile pass at startup, plus
#                               on-demand repair when a query touches a study
#                               whose idx row is missing. A stale idx never
#                               loses studies: idx is only an accelerator -
#                               QIDO falls back to a manifest scan.
#                    ERASE  pending erasures
#                    DISK   hot-disk free space %: green >= 2x emergency_free_gb,
#                           amber < 2x, LOW = below threshold
#                    RSS    process memory in MB (refreshed ~10 s)
#                           This is the WORKING SET of the process only.
#                           Image bytes never enter process memory: bodies
#                           stream from the OS file cache straight to the
#                           socket (TransmitFile), so RSS stays tiny and
#                           barely grows under load. Oscillation of a few
#                           MB in both directions is normal. Hot (recently
#                           served) studies live in the OS page cache -
#                           not counted in RSS and reclaimed by Windows
#                           under memory pressure.
#                           A build with --features transcode changes this:
#                           A) transcode requests move image bytes through
#                              process memory (peak = decoded frame size x
#                              concurrent transcodes) - RSS will jump;
#                           B) this widens the attack surface: compressed
#                              format decoders consume network data, and
#                              full in-memory decode allows decompression
#                              bombs (tiny file, huge frame) -> memory
#                              exhaustion;
#                           C) modern viewers transcode on their own GPUs -
#                              if the viewer accepts the stored syntax, the
#                              flag is not needed;
#                           D) if full DICOMweb compatibility is required
#                              (a viewer cannot read the stored syntax), or
#                              for rare narrow-channel clients (satellite):
#                              transcoding e.g. EVRLE -> JPEG-LS shrinks
#                              the payload - build with --features transcode,
#                              keeping A-B above in mind. Put such clients
#                              behind nginx and restrict their list hard
#                              (transcode is expensive; the server has no
#                              per-client transcode quota).
#                    S3     S3 latency ms / DOWN / -- (not configured)
#                    INST   logical instances across live manifests
#                           (the honest instance count - matches
#                           /admin/v1/status; drives QIDO totals)
#                    ORPH   replaced-version blobs awaiting the orphan GC
#                           (each update-in-place leaves the old blob until
#                           the GC drains the .orphans sidecar; 0 = clean)
#                    UNREF  CAS files referenced by NO live manifest:
#                           replaced-version orphans + hidden-PHI alibi
#                           copies + crash-window leaks. 0 = clean; >0 =
#                           extra physical copies, shown amber in the
#                           viewer. Orphans are reclaimed by the orphan
#                           GC (default every 60 min, see [btree]
#                           orphan_gc_interval_sec) or at study erase;
#                           alibi copies wait for study erase. Per-study
#                           detail: /admin/v1/storage/audit-copies.
#                    OBJ    physical objects in CAS (referenced + audit-only;
#                           last: grows unbounded)
#                    AUTH    user identity on protected traffic (PLANNED -
#                            access-audit phase, not shipped yet):
#                            --    no protected requests since start;
#                            ID    all recent protected requests carried an
#                                  authenticated identity (nginx passed a
#                                  user header from a trusted proxy);
#                            ANON  recent protected requests came WITHOUT
#                                  user identity. Honest boundary: the
#                                  server sees only whether an identity
#                                  header arrived - it CANNOT see whether
#                                  nginx enforces auth. ANON is NORMAL for
#                                  the IP-ACL/VPN modality model (scanners
#                                  have no user identity - they are admitted
#                                  by network policy). In every OTHER case
#                                  ANON means viewer traffic is
#                                  unauthenticated, and the admin is asked
#                                  to either:
#                                  1) configure nginx auth + identity
#                                     headers + trusted_proxies per
#                                     docs/nginx-auth.md, or
#                                  2) consciously accept the network-only
#                                     model and treat ANON as expected for
#                                     those peers.
#                                  The server reports missing attribution,
#                                  never "auth not configured" - the choice
#                                  of protection model is the admin's. A
#                                  rate-limited reminder WARN (PLANNED, at
#                                  most once per hour) repeats this when
#                                  ANON persists.
# /admin/v1/...      admin API: instances/search, instances/delete,
#                    status, dashboard, storage, storage/audit-copies
#                    (per-study view of extra physical blobs: hidden-PHI
#                    alibis + replaced-version orphans),
#                    storage/cas-audit (full CAS reconciliation, report-
#                    only), audit-log, access-log

# -- Own HTTP/1.1 stack timeouts ----------------------------------
# Clarus serves every connection on its own OS thread (thread-per-connection,
# the classic Apache-worker-MPM model). We do NOT run an async
# event-loop of our own - the OS kernel is far better at parking and waking
# threads than any userspace scheduler (Tokio included). That keeps the server
# simple and predictable: 512 connections = 512 mostly-sleeping threads, no
# epoll event-loop black magic. nginx in front of Clarus is what handles the
# C10K of slow browser/Viewer connections; Clarus sees a small number of fast,
# local peers and a few threads are plenty.

# NOTE: unlike nginx (where max_connections limits events per worker), our
# max_connections is a true thread count - one thread is one connection.

# These timeout knobs are the only "scheduler" we hand-tune. They are socket
# timeouts set on each connection at accept time - your safety net against a
# client that half-connects, stalls mid-request, or dies without closing.
# Without them one bad client could hold a thread open forever.

# header_timeout_secs - how long the server waits to read the request HEAD
# (method + URL + headers) before giving up. Guards against slowloris: a
# client that sends one byte every few seconds to keep a thread alive on
# purpose. If a connection sends nothing inside this window -> 408, thread
# freed. This one can't be disabled (0 rejected) - it is the anti-DoS net.
header_timeout_secs = 30
# body_timeout_secs - idle gap allowed BETWEEN body chunks while a request
# body is streaming in (STOW uploads, UPS create). 0 = disabled. Default 600s
# matters for a pathology (WSI) upload that sends a 50 GB body - the chunk
# gaps are small, but the whole upload takes minutes. 0 disables the guard for
# uploads that legitimately pause > this; otherwise keep it on.
body_timeout_secs = 600
# keepalive_timeout_secs - idle allowed between two requests on ONE reused
# (keep-alive) connection, after the first response is sent. 0 = keep-alive
# off (each request opens a fresh connection). Lower = faster thread reuse,
# but clients that reuse connections get cut early.
keepalive_timeout_secs = 10
# send_timeout_secs - how long the server keeps trying to WRITE a response
# to a stuck/slow client before giving up. Imagine a viewer that stops
# reading a WADO stream - without this the server would block a thread
# forever pushing bytes into a full socket buffer. On timeout the thread is
# freed and the connection dropped.
send_timeout_secs = 60
# drain_timeout_secs - ceiling on how long in-flight WADO streams may keep
# running AFTER the server starts shutting down (SIGINT). Gives active
# transfers a grace period to finish, then force-closes them. Second SIGINT
# always exits immediately (nginx-style fast shutdown).
drain_timeout_secs = 30
# ------------------- Thread tuning (thread-per-connection model) ------------
# The server allocates one OS thread per accepted connection (serve.rs,
# "conn-worker"); the stack size is fixed in code: WORKER_STACK = 512 KiB.
# Worst-case stack memory is therefore:

#     max_connections x 512 KiB     (512 x 512 KiB = 256 MiB)

# In practice the OS commits stack pages lazily, so 512 mostly-parked threads
# use far less RSS than 256 MiB. Per-connection I/O buffers (e.g. the 64 KiB
# stream buffer) add a little on top of the stack-only estimate.

# Range: 1..4096. The default 512 is safe for any box, including a Raspberry
# Pi 5 (4 cores / 8 GiB). On a large Xeon (16+ cores, 64+ GiB RAM) you can
# raise it to 1024-2048 for STOW-heavy or thumbnail-heavy load; parked
# threads cost almost no CPU until context-switch pressure appears. Keep the
# stack total well below physical RAM (under ~80%) - the OS refuses thread
# creation when it cannot reserve the stack.

# Above the ceiling new connections are closed without being read (the client
# sees a reset on write and retries). Signs you need more: connection
# resets/refusals under load, ESTABLISHED count pinned at max_connections.
# Signs you have too many: vmstat 'cs' > 100000, top '%sy' > 10-15%.

# stack_size is NOT a config knob - it is hardcoded (serve.rs WORKER_STACK).
# Keep 512 KiB unless a rebuild is planned.
max_connections = 512
# max_json_body - JSON request body cap (UPS create/update, admin), 1k..64m (k=KiB, m=MiB)
max_json_body = 1m
# max_part_header - STOW part-header read cap, 1k..64m
max_part_header = 4m

# Authentication is handled by nginx (see docs/nginx-auth.md).
# The server itself does not check passwords - nginx does.
# Example nginx config to separate modality access from viewer access:
#   location /dicomweb/ { allow 192.168.1.0/24; deny all; proxy_pass http://127.0.0.1:8024; }
#   location /         { auth_basic "Clarus"; auth_basic_user_file /etc/nginx/.htpasswd; proxy_pass http://127.0.0.1:8024; }

# -- Fixing empty DICOM tags --------------------------------------
# PatientName and PatientID are required DICOM fields, but some devices
# send them empty. Empty values make patient searches useless: all
# "empty" patients merge into one giant bucket.

# On save the server generates placeholders automatically:
#   PatientID   -> AUTOPAT_xxxxxxxxxxxx
#   PatientName -> Anonymous^xxxxxx

# A re-upload of an already stored instance (same SOP Instance UID,
# same study, same PatientID) REPLACES the stored bytes. Corrections
# to archived attributes are recorded in the Original Attributes
# Sequence (0400,0561) inside the newly stored file (reason CORRECT);
# server-generated placeholders (AUTOPAT_/Anonymous^) are recorded
# the same way with reason COERCE. Every replacement is recorded in
# the access journal (action U).

# --- Search result limits -----------------------------------------
# QIDO result limit used when a client sends no explicit `limit`.
# The limit protects the server: a client that never limits itself would
# otherwise force a full-archive scan and a huge response on every query.
# `0` = unlimited - only for small archives; on a large archive an
# unlimited query means long response times and high memory use.
# Scoped enumeration of a study's series / instances is NOT capped
# by this knob - only open-ended searches are (12.09 MicroDicom).
[query]
default_limit = 250
# The embedded viewer's PATIENT LIST sends no explicit limit - it follows
# this default too (one knob governs all QIDO clients). `0` = unlimited
# also swells the viewer's list - keep it bounded unless the archive is
# small.
# PN (Person Name) search behavior. These defaults deviate from the letter
# of the standard ON PURPOSE: name search just works out of the box.
#   case_sensitive_pn = false: PN globs match case-insensitively
#     (Orthanc-style). Standard PS3.4 wildcard matching is case-sensitive -
#     set true for strict standard behavior.
#   fuzzymatch_override = true: forces Levenshtein-1 matching on PN keys
#     even for clients that never send fuzzymatching=true (e.g. Weasis).
#     Set false for strict standard behavior.

# case_sensitive_pn = false makes PatientName / ReferringPhysicianName glob
# case-insensitive (Orthanc-style convenience):
#   true:  "Solgalov*" matches "Solgalov^Daniil^Yur'evich", "solgalov*" does not
#   false: both patterns match
case_sensitive_pn = false

# fuzzymatch_override = true forces Levenshtein-1 matching on PN keys even for
# clients that never send fuzzymatching=true (e.g. Weasis), so a typed name
# with one typo still finds the patient:
#   "Salgalov" finds "Solgalov^Daniil^Yur'evich"
# Note: for PN patterns WITHOUT wildcards the fuzzy match is case-insensitive
# by construction (both sides are lowercased), so fuzzymatch_override
# effectively overrides case_sensitive_pn for those patterns. Patterns WITH
# wildcards still follow case_sensitive_pn.
fuzzymatch_override = true

# Name search without wildcards: a bare component like "Daniil" does NOT
# match "Solgalov^Daniil^Yur'evich" - not even with fuzzymatch_override:
# fuzzy matching is one-edit name variants, not substring search
# (PS3.4 C.2.2.2.1). To search by given/middle name use a wildcard:
#   "*Daniil*" matches with any case_sensitive_pn setting (exact case);
#   "*daniil*" matches only when case_sensitive_pn = false.

# --- BONUS: Fuzzy Matching for Legacy DIMSE (C-FIND) -------------
# Person-name fuzzy matching exists in the DICOM standard, but almost no
# deployed scanner or viewer implements it - in practice a typo like
# "Salgalov" returns zero results.

# With 'fuzzymatch_override = true' the 'clbridge' proxy injects
# Levenshtein-1 matching into every C-FIND name query:
#   bridge -> QIDO-RS -> Clarus hot path (bit-parallel Bitap on stack
#   masks, zero heap, no SQL database) -> standard C-FIND response back
#   to the scanner.
# No changes needed on the device side - it never learns DICOMweb exists.
# Your radiographers get typo-tolerant results on 30-year-old hardware.
# ------------------------------------------------------------------

# --- UPS-RS search result limit (12.09) -------------------------
# Separate dial from [query] on purpose: modalities poll
# /dicomweb/workitems every few minutes, so the DoS surface differs
# from viewer-driven QIDO. 0 = unlimited. Default 100.
[ups]
default_limit = 100

# Clarus as the Task Producer: after a durable STOW, create ONE UPS-RS
# workitem for the study. This is the origin-server capability PS3.18 11.1
# allows - "User agents and origin servers can create Workitems" - so the
# STOW trigger is a product feature built on a standard permission, not a
# conformance requirement.

# The Producer role is interchangeable: a modality, a RIS, an external
# orchestrator, or Clarus itself may each fill it, and they are all standard.
# It is off by default for that reason. The Task Performer (clinfer) claims
# workitems regardless of who created them, so turning this on is a choice
# about WHO offers the task, not about whether it can be performed.

# No modality filter: a non-matching study is cancelled by the sidecar itself.
task_producer = false

# Retention of workitems in a final state (PS3.18 Section 11 policy).
# The standard sets no duration; this is the SCP's own policy for the
# admin DELETE extension, applied in bulk. A workitem whose state is
# COMPLETED or CANCELED and whose last update is older than this many
# days is removed once at start-up and then every 24 hours.
#   0    = keep final workitems forever (the sweep does not run)
#   7    = shipped default
#   3650 = ten years (upper bound)
# SCHEDULED and IN PROGRESS workitems are NEVER swept: a stuck
# IN PROGRESS is the dead-claimant case, which an operator resolves
# through the admin DELETE, not through retention.
# note: a CAD workitem's UID is derived from its study UID, so sweeping
# a final one lets a re-STOW of that study mint the SAME workitem again -
# re-inference of the study becomes possible by design.
final_state_retention_days = 7

# Deletion Lock lifetime in hours (PS3.18 11.10, PS3.4 CC.2.3.1).
# A subscriber may create its subscription with `?deletionlock=true`,
# which protects the workitems it is subscribed to from the retention
# sweep above. AIW-I 4.86.4.1.2 requires the Manager to support
# Deletion Locks; AIW-I 4.85.4.1.3 allows the Manager to override a
# remaining lock, but only if it "shall be capable of waiting at least
# 24 hours before such deletions" - and says that capability may be
# configurable. This is that dial.
#   24   = shipped default (the profile's 24-hour floor)
#   8760 = one year (upper bound)
#   0    = locks are not honoured: the sweep deletes exactly as it did
#          before Deletion Locks existed (the override, turned off).
# The lock is released by unsubscribing (PS3.4 CC.2.3.1 Table CC.2.3-2:
# "AE Unsubscribes from Specific UPS: Go to Not Subscribed").
# note: the subscription registry is in memory, so a restart forgets
# the locks along with the subscriptions they belong to.
deletion_lock_ttl = 24

# Push retries when delivering a workitem to a subscriber's callback URL.
# Range 1..5. Default 3. Each retry is a fresh HTTP POST; a subscriber
# that answers 2xx stops the sequence. Validated, not clamped: a typo is
# refused at start-up rather than silently buying a different budget.
# push_attempts = 3

# AE Title written into (0040,0001) Scheduled Station AE Title for an
# AUTOMATIC (performer-claimable) workitem. Absent or empty writes the tag
# not at all, which is the wire shape this server produced before the
# catalog existed - so switching the catalog on changes nothing for an
# existing deployment. Must be <= 16 chars (AE, PS3.5 Table 6.2-1).
#
# The minted workitems are ALL automatic: a `[ups.manual_codes]` entry is
# DECLARATIVE and is created by the Task Requester (e.g. Weasis) through
# UPS Create (PS3.18 11.4), so the automaton never addresses one.
# ai_station_aet =

# Modalities that never auto-mint a workitem, even when `fallback` is set:
# these are AI OUTPUTS (results), not inputs.
# Comma-separated, upper-cased on read. Default: SR,PR,SEG,KO,RTSTRUCT.
# non_task_modalities = SR,PR,SEG,KO,RTSTRUCT

# --- Workitem catalog (AI task vocabulary) ------------------------------
# The catalog maps a study's modality to the Code Value the generated
# workitem carries in Scheduled Workitem Code Sequence (0040,4018), and
# gives each code the label a viewer shows. It is read ONLY when
# task_producer is on. Three sections:

#   [ups.workitem_code]  MODALITY -> code value(s)
#   [ups.code_meaning]   code value -> label (the viewer's dropdown text)
#   [ups.manual_codes]   code values that are declarative (NOT minted)

# Every example below is COMMENTED OUT: the shipped defaults stay in force
# and behaviour is unchanged until a site uncomments and edits them.

# [ups.workitem_code]
# DX = CXR-AI
# CT = CT-ORGAN-SEG
# fallback = GENERIC-AI
# meaning = AI inference#
# [ups.code_meaning]
# CXR-AI = Chest X-ray AI
# CT-ORGAN-SEG = CT organ segmentation

# [ups.manual_codes]
# REVIEW-ONLY

[workflow]
# Modality Worklist (MWL) and Modality Performed Procedure Step (MPPS) over
# DICOMweb (PS3.18 Sections 14 and 15). MWL is search-only (14.3: no Create
# exists); MPPS is Create (15.4) / Update (15.5, the mandatory ?update
# parameter) / Retrieve (15.6, OPTIONAL). Records are mutable and
# short-lived, so they live under this section's own directory (mwl/ and
# mpps/ below it), not in the immutable archive.
#
# Off by default: a deployment that has not opted in does not answer these
# two resources. A disabled surface answers 404, not 405.
enabled = true
#
# The store root. Empty (the default) means {btree.root}/workflow, so the
# records land beside manifests/ and idx/ rather than in the process CWD.
# A relative path resolves against this config file's parent.
# dir =
#
# Days a record is kept before the retention sweep deletes it: an MWL row
# and a FINAL MPPS row (COMPLETED or DISCONTINUED). An IN PROGRESS MPPS row
# is never swept. Default 7. Range 0..=3650. 0 = keep forever.
# retention_days = 7
#
# MWL search response bound when the client sends no limit. 0 = unlimited
# (still clamped by mwl_max_responses below). Default 100.
# mwl_default_limit = 100
#
# The HARD ceiling on an MWL search response. Default 200. Range 1..=10000.
# mwl_max_responses = 200

# -- [commitment] Storage Commitment retention -------------------------
# How long a DICOMweb Storage Commitment result stays available for
# retrieval, in days (PS3.18 Section 13, Commit / Check Commit Result).
# PS3.18 13.2 fixes no duration and instead requires the origin server to
# state it: this key is that statement.

# Default 30. Range 0..=3650. 0 = keep results forever (the sweep is off).
# A swept Transaction UID makes Check Commit Result answer 404, which
# Table 13.5.3-1 allows for a deleted result; no 410 tombstone is kept.
[commitment]
# result_retention_days = 30

[storage]
# One instance per data directory: two Clarus instances sharing the same
# data dir is clustering, which is done via cluster-redis/Valkey - not by
# pointing both at one directory.
# Where to store DICOM files on disk
storage_dir = /data

# DISK semantics in a container: the viewer indicator and the free-space
# guards (STOW 507 preflight, emergency migration) stat the FILESYSTEM
# where this directory lives. With the default named volume (clarus-data)
# that is the host's docker data-root filesystem - usually the ROOT
# partition - so DISK% reports the docker-root free space, NOT a dedicated
# data disk. To report the real PACS disk: bind-mount it into /data
# (compose: `- /mnt/dicom:/data`) or relocate the docker data-root.

# -- Storage-tier override for the hot directory -------------------------
# cold_path also exists in [storage_tiers] (the NAS/HDD tier migration
# writes to). The [storage] form applies its free-space guard to that same
# volume, so the reject threshold below and the migration target agree.
# Set it in ONE place only - [storage_tiers] is the canonical one.
# [storage]
# cold_path = /mnt/nas/archive

# -- Antivirus exclusion (real-time AV, e.g. Windows Defender) -----------
# STOW ingest creates 2-3 NEW files per instance (CAS temp, CAS rename,
# manifest tmp+rename) and real-time AV scans every create. Field
# measurement (1063-instance / 987 MB corpus, loopback, no code changes):
#   Defender ON        : 78-101 MB batches 5.0-7.1 s (11-15 MiB/s);
#                        the final batch of the run took 59.7 s
#   data dir excluded  : same batches 1.3-1.5 s (55-60 MiB/s, 4-5x);
#                        that final batch 0.17 s (350x); total 1.45x
# If ingest throughput matters on this box, add storage_dir (and the
# btree root below, if it differs) to the AV real-time exclusions.
# WADO reads are not scanned and need no exclusion.
# Windows: Add-MpPreference -ExclusionPath "D:\path\to\data"

# Max size of a single image in megabytes (default 500).
# Rough guide by modality:
#   10   - plain X-ray (CR/DX)
#   100  - CT / MRI
#   500  - safe default for most studies
#   4096 - digital pathology (SM/WSI), gigapixel scans
max_instance_size_mb = 500

# max_frame_bytes - max bytes of ONE frame served by a WADO /frames/{N} call.
# Range 1m..1024m (default 64m). A frame's byte length comes from the stored
# file (the encapsulated item_len), so it is attacker-controlled: a crafted
# WSI tile is a few hundred KiB, so 64 MiB is two orders of magnitude of
# headroom; raise it only for an exotic device that stores huge single tiles.
max_frame_bytes = 64m

# max_frames_per_instance - max frames ONE instance may declare/hold.
# Range 1..16777216 (default 1000000). The manifest frame table costs
# ~56 bytes per frame, so an instance with an unbounded frame count amplifies
# /frames/{N} request to read the whole instance). 1000000 x 56 B = ~56 MiB
# max per instance. The ceiling 16777216 exists so one table stays under 1 GiB.
max_frames_per_instance = 1000000

# -- STOW batch memory guard (group commit) ----------------------
# When a device uploads a study, the server receives ALL slices first
# and writes the study index to disk ONCE per study per upload (instead
# of rewriting the index after every slice). Until that single write,
# the accepted slice metadata is held in RAM - only metadata (names,
# hashes, sizes), never the image bytes themselves.

# These two knobs cap that in-memory accumulation:
#   max_batch_instances - maximum slices held before an early write;
#   max_batch_bytes     - maximum total bytes held before an early write.
# If a single upload crosses either limit, the server honestly writes
# what it has already received and continues - nothing is lost, the
# upload does NOT fail.

# The defaults match the bridge upload profile (100 slices / ~100 MB
# per request), so in normal operation the limits never trigger.
# Change them only if a device sends much larger uploads and the server
# shows memory pressure. Rule of thumb: each held slice costs a few
# hundred bytes of RAM - the image itself is not held.

max_batch_instances = 100
max_batch_bytes = 100m

# Reject new images when disk space is low.
# Server checks BEFORE reading the request body - immediate HTTP 507.
# Either condition triggers rejection. 0 = don't check.
min_free_disk_mb = 5000    # minimum free megabytes
min_free_disk_pct = 5.0    # minimum free percent

# -- Storage tiers: automatic migration hot -> cold -> cloud ------
# Three independent policies. Each backend (NAS, S3) has its own
# cron schedule and minimum study age. Emergency migration protects
# against disk-full - ignores age, migrates oldest studies first.

# Migration order (planned):  cold_path -> S3 (fast local first).
# Migration order (emergency): cold_path -> S3 (fast local first).

# -- Emergency (disk-full protection) ----------------------------
# Server checks free space every N minutes on the hot disk (storage_dir).
# If free space drops below the threshold, the oldest studies are
# migrated immediately - regardless of their age.

# Reject threshold (STOW returns HTTP 507) is set separately in
# [storage] min_free_disk_mb / min_free_disk_pct.
# Emergency migration should trigger BEFORE the reject threshold.

[storage_tiers]
emergency_free_gb = 0               # Free space below this -> emergency migration.
                                    # 0 = don't check. Default: 0.
emergency_check_interval_mins = 5   # How often to check free space.
                                    # Range: 1-60. Default: 5.

# Cron syntax (Clarus subset, strict AND-semantics):
#   5 fields: minute hour day-of-month month day-of-week.
#   Supported: numbers, lists (1,5), ranges (1-5), steps (*/15, 1-10/2).
#   Not supported: names (JAN, MON), L/W/#, @shortcuts, seconds field.
#   day-of-month AND day-of-week combine with strict AND:
#     "0 0 13 * 5" = only Friday the 13th, NOT "13th OR Friday" (Vixie).
#   If an exotic schedule never fires - check this subset first.

# -- Local cold storage (NAS, HDD, second disk) ------------------
# Fast, local file-system tier. Studies remain instantly accessible.
# Example (cold tier disabled by default - uncomment to enable):

# cold_path = /mnt/nas/archive     # Path to cold directory.
# cold_schedule = 0 */6 * * *      # Cron: every 6 hours at :00.
# cold_min_age_days = 90           # Migrate studies older than 90 days.

# -- Cloud cold storage (S3: MinIO, AWS, Ceph, Yandex Object Storage) ---
# Cheap but slower. Requires build with --features s3.
# Connection parameters are in [s3] section below.
# Example (S3 tier disabled by default - uncomment to enable):

# s3_schedule = 0 2 * * *          # Cron: daily at 02:00.
# s3_min_age_days = 180            # Migrate studies older than 180 days.

# -- Priority (nginx-way: fast local first, slow remote second) --
# Planned migration (by cron):
#   1. cold_path - fast, local. File already there for WADO reads.
#   2. S3 - slower, remote. After cold_path succeeds, OR directly
#      from hot if cold_path is not configured.

# Emergency migration (disk full):
#   1. cold_path - fastest way to free space.
#   2. S3 - fallback if cold_path is unavailable or not configured.

# -- Replication, backup, compression ----------------------------
# Clarus does NOT replicate data between tiers. Use OS tools:
#   robocopy / rsync / DFS-R   - replicate hot or cold to backup
#   BitLocker / LUKS           - encrypt disks
#   NTFS compression / ZFS     - compress filesystem
#   VSS / ZFS snapshots        - point-in-time recovery

# S3 cold storage connection parameters are in [s3] section below.
# Migration schedule for S3 is in [storage_tiers] above.


# -- Study index (B-tree) storage ---------------------------------
# The study index lives here: manifests, daily index files and the audit
# trail. Each subdirectory can be moved to its own disk:
#   manifests + index - fast disk (SSD) for query speed;
#   audit - protected storage (it is the only evidence of deletions).
[btree]
# Root of the study index. IN CONTAINER all paths here MUST be
# ABSOLUTE under /data: relative paths resolve against the CONFIG FILE
# dir (/etc/clarus), which is NOT the volume - relative ./data would
# silently live in the container layer and die with the container.
# Outside containers: default ./data (same base as [storage]).
# One instance per data directory: a startup guard (.clarus-data.lock) refuses
# a second instance pointed at the same root. Sharing one data dir across two
# instances is clustering, which is done via cluster-redis/Valkey.
root = /data
# UPS-RS workitems (received but not yet DICOM) live under root as well:
#   {root}/workitems/{workitem_uid}.cbor
# Derived from root - there is deliberately no separate knob for it (F-009).
# Study manifests (one file per study). Default: ./data/manifests/
manifest_dir = /data/manifests
# Daily index files (fast lookups by date/modality). Default: ./data/idx/
idx_dir = /data/idx
# Append-only audit trail of deletions.
# THE ONLY EVIDENCE OF DELETIONS - BACK UP THIS DIRECTORY. Default: ./data/audit/
# Each delete row records WHO deleted, WHEN (UTC), WHAT was
# deleted (UID) and WHICH PATIENT it belonged to (PatientID only -
# names are never written).
# Permissions: on Unix the DIRECTORY is forced to 0700 at startup and
# re-checked on every append (self-fix + WARN; startup refuses to run if
# the fix itself fails). Files are created 0600 at open. A permissions
# anomaly is recorded in the trail (security_perm_fix rows).
# On Windows the code skips chmod (NTFS ACL model): restrict access with
# a one-time ACL on the directory (inheritance covers future rotation):
#   icacls <audit_dir> /inheritance:r /grant:r "SYSTEM:(OI)(CI)F" "BUILTIN\Administrators:(OI)(CI)F" "<service_account>:(OI)(CI)F"
# The trail is NOT tamper-proof (same filesystem): use OS-level controls
# (auditd, chattr +a, off-box backup) - see docs/.
# Encryption at rest is the OS-level mount encryption (BitLocker / LUKS / EFS).
audit_dir = /data/audit
# Access-audit journal (ATNA-lite per GOST R ISO 27789-2016): one JSON line
# per access/query event, identifiers only. Sibling of the delete trail;
# retention-pruned (never touches audit/). Default: ./data/access/
access_dir = /data/access
# Days of recent index data warmed into the OS page cache at startup:
# the newest N-1 rolled-over .idx files are mmap'd once and unmapped
# (today's file is mutable and excluded), so the first queries after a
# restart avoid page faults; ~0.5 MB of page cache per day. Default: 7.
preload_days = 7
# Orphan GC interval (seconds): how often the erase worker drains
# replaced-version blobs recorded in {study}.orphans sidecars
# (refcount-checked, background only - never on the STOW hot path).
# 0 = disable the GC (orphans then wait for study erase). Default: 3600.
orphan_gc_interval_sec = 3600

# --- Example: manifests and audit on NAS, index on SSD ---------
# All three subdirectories may live on different disks:

#   manifest_dir = \\NAS\clarus\manifests
#   idx_dir      = C:\clarus\idx
#   audit_dir    = \\NAS\clarus\audit

# Rules of thumb:
#   1. Keep idx_dir on a LOCAL SSD: an index on a network share makes
#      every search wait on the network.
#   2. Keep audit_dir where it is backed up (it is the only evidence of
#      deletions) - a NAS with snapshots is a good home.
#   3. After changing paths, include the new locations in your backups;
#      if you moved manifests, run a rebuild (see the MNF gauge above).

# -- [transcode] bounded pool -----------------------------------------
# Optional overrides. When a key is absent (commented), the default is
# computed AUTOMATICALLY; `clarus --config clarus.conf -t` prints the
# effective values. The defaults already hard-bound CPU (N concurrent
# decodes/renders) and memory (N x decoded frame size). No queue: a
# saturated pool answers 503 + Retry-After, never 100% CPU.

# If these keys are set but the binary was built WITHOUT
# --features transcode, the server starts normally with a WARN - the
# keys are inert (transferSyntax requests are served with original bytes).
[transcode]
# Global concurrent transcode/render permits.
# Default = clamp(available_parallelism()/4, 1..32) - a quarter of the
# cores, so transcoding never starves normal traffic.
# Range 1..32.
# transcode_max_concurrent = 8
# Max decoded pixels per instance (megapixels), checked BEFORE decode -
# a deterministic guard against decompression bombs. Default 64 MP.
# transcode_max_megapixels = 64

[logging]
# Directory for log files. Relative paths resolve against the config file
# location. In the container: /data/logs (lives on the data volume).
# Files rotate daily (clarus.log.YYYY-MM-DD); important events also go to stderr.
# Default: ./logs
# Production (Linux FHS): /var/log/clarus
# Container: stdout/stderr goes to the docker log driver - log_dir is the
# FILE audit trail on the data volume.
log_dir = /data/logs

# Ceiling over the INFO whitelist: ONE level for BOTH the file and the
# console mirror (nginx-way). Allowed: error | warn | info | debug | trace
# (case-insensitive). Default: info.
# In release builds debug/trace behave as info (DEBUG/TRACE never reach the
# file or the console). The console is lossy by design, exactly like the
# file: under overload a slow terminal can drop lines.
log_level = info

# Every request writes its own nginx-style ACCESS line right after the
# response is dispatched - no waiting for the next request. Only /health and
# /metrics probes are excluded (load-balanced liveness pings, not traffic).
# A STOW upload still aggregates: ONE "started" line on the first slice and
# ONE "completed" when the session goes quiet (30s TTL), never per slice.

# All lines are pushed into a bounded ring drained by the dedicated
# log-writer thread - the hot path never touches the filesystem. The price
# for that: log data arrives with a short delay (regular lines within ~0.1s;
# STOW/WADO session totals within their 30s/60s TTL plus the 5s sweep tick).
# The log is eventually-consistent BY DESIGN. Under extreme overload the ring
# may drop lines (lossy, like the console mirror) - producers never block.

# During a large upload, progress is logged every 50 slices (STOW_STUDY
# progress lines), never per slice: readable logs and no per-slice log I/O
# in the hot path.

# -- S3-compatible object storage (MinIO, AWS S3, Yandex, Ceph) ---
# Requires build with --features s3. Used as cold storage fallback for WADO-RS reads.
# The server falls back transparently: hot CAS -> cold_path -> S3.

# --- Required ---
# [s3]
# endpoint = http://127.0.0.1:9000
# Use 127.0.0.1 here, NOT localhost. localhost resolves to IPv6 ::1 first
# on most systems; if MinIO listens only on IPv4 (0.0.0.0), the client
# waits 3-10 seconds for IPv6 to time out before falling back to IPv4.
# That makes every first S3 request 10x slower and can overwhelm MinIO
# with half-open connections.

# Credentials. Empty = anonymous (public bucket, MinIO dev mode).
# access_key = minioadmin
# secret_key = minioadmin

# Bucket name.
# bucket = clarus-storage

# --- Optional (defaults shown, uncomment to override) ---
# AWS region. Default: us-east-1 (MinIO ignores this).
# region = us-east-1

# Object key prefix inside bucket. Default: store/.
# Objects are stored as: {prefix}{xx}/{yy}/{blake3}.dcm
# prefix = store/

# Which tier this backend serves. Default: s3. Leave it alone unless
# you are layering a second object store; the value selects the
# migration policy the [storage_tiers] schedules drive.
# tier = s3

# There is deliberately no request-timeout knob here: the S3 client uses
# the HTTP timeouts of the [server] section, so one place governs every
# outbound read.

# --- TLS / mTLS ------------------------------------------------
# Clarus does NOT do TLS. nginx (or another reverse proxy) terminates
# TLS/mTLS in front of the server - it handles certificates, handshake,
# CA pinning and rotation better than a server would.

#   server          -> 127.0.0.1:8024   (plain HTTP, localhost only)
#   nginx           -> :443 (TLS) / :8443 (mTLS) + proxy_pass 8024

# Example nginx snippet (client cert auth / mTLS):
#   ssl_client_certificate /etc/clarus/ca.crt;
#   ssl_verify_client on;
#   location /dicomweb/ { proxy_pass http://127.0.0.1:8024; }

# Full guide: docs/nginx-auth.md

# -- S3 notes ----------------------------------------------------
# Retry: reqwest handles HTTP retries automatically.
# Proxy: set HTTP_PROXY / HTTPS_PROXY environment variables.
#   reqwest reads them automatically - no config needed.
# Storage class: managed by bucket lifecycle policy (AWS Console),
#   not by Clarus. PUT does not specify a class.

# If S3 is configured but the 's3' feature is not compiled in,
# the server starts normally with a warning:
#   "S3 storage is configured, but 's3' feature is not compiled in.
#    Rebuild with: cargo build --features s3"

# Validation: GET /admin/v1/storage/s3-validation

# -- Optional codecs -----------------------------------------------------
# A codec is compiled in, not configured: the build decides which transfer
# syntaxes the server can decode. This section carries the one runtime
# switch that exists.

# jpeg2000 - serve JPEG 2000 (1.2.840.10008.1.2.4.90/.91) frames. The
# decoder is always compiled in, so this only turns the pathway off:
#   true  (default) - J2K frames are decoded and served as stored
#   false           - J2K requests are refused rather than decoded
# [features]
# jpeg2000 = true

[audit]
# This section governs ONLY the ACCESS journal policy (access_retention_days,
# auth_warn_interval_min, access_prune_dry_run), acting on access_dir in
# [btree]. The DELETE trail is audit_dir in [btree] - append-only, NO
# retention dial, kept forever and backed up.
# --- [audit] access journal (ATNA-lite) ---------------------------
# Days to keep access journal files (0 = keep forever). Default 1095 (3
# years) - a PRODUCT choice covering the inspection horizon, NOT a
# regulatory number; align with your own retention policy.
# The pruner only ever touches the access_dir (structurally never the
# delete trail).
access_retention_days = 1095
# Minimum minutes between the "requests without user attribution are
# being served" WARN. Default 60. The server only knows identity-header
# presence - the text never claims "auth not configured". 0 / negative /
# non-numeric -> WARN in clarus.log + default 60 (never fatal).
auth_warn_interval_min = 60
# Pruner dry-run: report ACCESS_ROTATE lines but delete nothing
# (first-deployment flag). Default false.
access_prune_dry_run = false
