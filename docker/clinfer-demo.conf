# clinfer demo configuration (Docker). Task Performer for the OHIF UPS-RS
# demo. The origin is the `clarus` service on the compose network, not
# localhost. chmod 600 in the image (paths only, no secrets, but keep the
# convention).

server:
  base_url: "http://clarus:8024/dicomweb"
  identity_user: "clinfer"
  listen: "127.0.0.1:8124"
  require_proxy_identity: false

engine:
  cache_dir: "/data/clinfer-cache"

models:
  clahe:
    script: "/opt/clinfer/abi/DERIVED-clahe.py"
    interpreter: "python3"
    timeout_secs: 300

  upscale:
    script: "/opt/clinfer/abi/DERIVED-upscale.py"
    interpreter: "python3"
    timeout_secs: 300

rules:
  - match:
      code: [CXR-CLAHE]
      modality: [DX, CR]
      body_part_contains: ["*lung*"]
    model: "clahe"
    result:
      kind: derived
      series_description: "CLAHE"
      profile_version: 1

  - match:
      code: [CXR-UPSCALE]
      modality: [DX, CR]
      body_part_contains: ["*lung*"]
    model: "upscale"
    result:
      kind: derived
      series_description: "Upscaled x2"
      profile_version: 1

default_rule: cancel
