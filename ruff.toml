# Ruff config for the Clarus DIMSE bridge (clbridge).
# Kept deliberately narrow: correctness rules only (pycodestyle E4/E7/E9,
# Pyflakes F) plus import sorting. Opinion/style rules (RUF/BLE/S/SIM/PERF/
# UP/LOG) stay OFF - the bridge predates them, and rewiring its cleanup
# patterns (try/except pass on shutdown, class-attribute state in wire-test
# fake servers) is out of scope. Run with: ruff check clbridge
line-length = 88

# clbridge.py is auto-generated by bundle.py - never linted or edited by hand.
exclude = ["clbridge/clbridge.py"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]
# E402: the bridge deliberately imports inside functions (metrics counters,
# circular-import avoidance) - a structural pattern, not an accident.
ignore = ["E402"]

# CONVENTION: an import kept as an intentional re-export (used only by other
# modules or pinned by tests, e.g. main.py JPEGLS_LOSSLESS_TS) MUST carry
# `# noqa: F401` with a comment on the same line. ruff --fix respects noqa and
# will not delete it; without the marker it WILL be auto-removed as "unused".
